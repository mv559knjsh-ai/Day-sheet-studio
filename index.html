// ---------- Overview ----------

function Overview({ visits, saveVisits, settings, dayTotals, saveDayTotals }) {
  const [mode, setMode] = useState("pay");
  const [offset, setOffset] = useState(0);
  const [reportOpen, setReportOpen] = useState(false);

  const range = useMemo(() => computeRange(mode, offset, settings), [mode, offset, settings]);
  const prevRange = useMemo(() => (mode === "all" ? null : computeRange(mode, offset - 1, settings)), [mode, offset, settings]);

  const inRange = (r) => (v) => !r || (v.date >= r.start && v.date <= r.end);
  const scoped = visits.filter(inRange(range));
  const prevScoped = prevRange ? visits.filter(inRange(prevRange)) : null;

  const summarize = (list) => {
    const production = list.reduce((s, v) => s + (v.charge || 0), 0);
    const insBilled = list.reduce((s, v) => s + (v.insuranceBilled || 0), 0);
    const insPaid = list.reduce((s, v) => s + (v.insurancePaid || 0), 0);
    const ptPaid = list.reduce((s, v) => s + (v.patientPaid || 0), 0);
    const collected = insPaid + ptPaid;
    const outstanding = list.reduce((s, v) => s + Math.max(0, (v.charge || 0) - totalPaid(v)), 0);
    const insPending = Math.max(0, insBilled - insPaid);
    const netRate = production > 0 ? (collected / production) * 100 : null;
    return { production, insBilled, insPaid, ptPaid, collected, outstanding, insPending, netRate };
  };
  const cur = summarize(scoped);
  const prev = prevScoped ? summarize(prevScoped) : null;

  const perProvider = settings.providers.map((p) => {
    const mine = scoped.filter((v) => (v.providerId || settings.providers[0]?.id) === p.id);
    const prod = mine.reduce((s, v) => s + (v.charge || 0), 0);
    const coll = mine.reduce((s, v) => s + totalPaid(v), 0);
    const base = p.payBasis === "production" ? prod : coll;
    return { ...p, prod, coll, pay: base * (p.commissionPct / 100), visits: mine.length };
  });

  const chartData = useMemo(() => {
    const byKey = {};
    const useMonth = mode === "all" && scoped.length > 40;
    scoped.forEach((v) => {
      const key = useMonth ? v.date.slice(0, 7) : v.date;
      byKey[key] = byKey[key] || { key, "Insurance paid": 0, "Patient paid": 0 };
      byKey[key]["Insurance paid"] += v.insurancePaid || 0;
      byKey[key]["Patient paid"] += v.patientPaid || 0;
    });
    return Object.values(byKey).sort((a, b) => a.key.localeCompare(b.key)).slice(-14);
  }, [scoped, mode]);

  const payerMix = [
    { name: "Insurance paid", value: cur.insPaid, color: TEAL },
    { name: "Patient paid", value: cur.ptPaid, color: NEUTRAL_BAR },
    { name: "Outstanding", value: cur.outstanding, color: SIENNA },
  ].filter((d) => d.value > 0.004);
  const mixTotal = payerMix.reduce((s, d) => s + d.value, 0) || 1;

  const byProvider = perProvider.filter((p) => p.prod > 0);

  const thisMonth = todayISO().slice(0, 7);
  const monthProduction = visits.filter((v) => v.date.slice(0, 7) === thisMonth).reduce((s, v) => s + (v.charge || 0), 0);
  const goal = settings.monthlyProductionGoal || 0;
  const goalPct = goal > 0 ? (monthProduction / goal) * 100 : 0;

  const aging = useMemo(() => computeAging(visits), [visits]);
  const agingTotal = Object.values(aging.buckets).reduce((s, v) => s + v, 0);
  const AGING_COLOR = { "0–30": TEAL, "31–60": NEUTRAL_BAR, "61–90": GOLD, "90+": SIENNA };
  const rangeLabel = range ? range.label : "All time";

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, gap: 8 }}>
        <div style={{ display: "flex", background: "#E3F3EE", borderRadius: 16, padding: 4, gap: 4, flex: 1 }}>
          {[["pay", "Pay period"], ["month", "Month"], ["all", "All time"]].map(([k, label]) => (
            <button key={k} onClick={() => { setMode(k); setOffset(0); }} style={{
              flex: 1, padding: "7px 4px", borderRadius: 13, fontSize: 12.5, cursor: "pointer", border: "none",
              background: mode === k ? GRAD_PRIMARY : "transparent",
              boxShadow: mode === k ? "0 3px 10px -2px rgba(108,92,231,0.5)" : "none",
              color: mode === k ? ON_ACCENT : INK_SOFT, fontWeight: mode === k ? 700 : 600,
              fontFamily: FONT_BODY,
            }}>{label}</button>
          ))}
        </div>
        <button onClick={() => setReportOpen(true)} title="PDF summary report" style={{
          width: 42, height: 42, borderRadius: 14, border: `1px solid ${LINE}`, background: CARD, boxShadow: "0 2px 8px rgba(36,31,61,0.06)",
          display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
        }}>
          <Printer size={16} color={INK} />
        </button>
      </div>

      {mode !== "all" && (
        <div style={{ ...GLASS, display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 6px", marginBottom: SP }}>
          <button onClick={() => setOffset(offset - 1)} style={{ border: "none", background: "none", cursor: "pointer", color: INK_SOFT, padding: 8, display: "flex" }}><ChevronLeft size={18} /></button>
          <span style={{ fontFamily: FONT_MONO, fontSize: 14 }}>{range.label}</span>
          <button onClick={() => setOffset(offset + 1)} style={{ border: "none", background: "none", cursor: "pointer", color: INK_SOFT, padding: 8, display: "flex" }}><ChevronRight size={18} /></button>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 10 }}>
        <Card label="Production" raw={cur.production} format={fmtMoney} sub={`${scoped.length} visit${scoped.length === 1 ? "" : "s"}`}
          trend={<Trend cur={cur.production} prev={prev?.production} />} />
        <Card label="Billed to insurance" raw={cur.insBilled} format={fmtMoney} accent={SLATE}
          trend={<Trend cur={cur.insBilled} prev={prev?.insBilled} />} />
        <Card label="Collected" raw={cur.collected} format={fmtMoney} accent={TEAL} sub={`Ins ${fmtMoney(cur.insPaid)} · Pt ${fmtMoney(cur.ptPaid)}`}
          trend={<Trend cur={cur.collected} prev={prev?.collected} />} />
        <Card label="Outstanding" raw={cur.outstanding} format={fmtMoney} accent={cur.outstanding > 0 ? SIENNA : INK}
          trend={<Trend cur={cur.outstanding} prev={prev?.outstanding} invert />} />
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: SP }}>
        <Card label="Insurance pending" raw={cur.insPending} format={fmtMoney} accent={cur.insPending > 0 ? GOLD : INK} sub="Billed, not yet paid"
          trend={<Trend cur={cur.insPending} prev={prev?.insPending} invert />} />
        <Card label="Net collection rate" value={cur.netRate === null ? "—" : `${cur.netRate.toFixed(1)}%`}
          trend={cur.netRate != null ? <Trend cur={cur.netRate} prev={prev?.netRate} point /> : null} />
      </div>

      {goal > 0 && (
        <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
            <div style={SECTION_TITLE}>Monthly goal</div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: INK_SOFT }}>{fmtMoney(monthProduction)} of {fmtMoney(goal)}</div>
          </div>
          <div style={{ height: 12, borderRadius: 6, background: "#FFFFFF", border: `1px solid ${LINE}`, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${Math.min(100, goalPct)}%`, background: TEAL, transition: "width .5s ease" }} />
          </div>
          <div style={{ fontSize: 11.5, color: INK_SOFT, marginTop: 8 }}>
            {goalPct >= 100
              ? `Goal reached — ${fmtMoney(monthProduction - goal)} over, this calendar month.`
              : `${goalPct.toFixed(0)}% of this calendar month's goal.`}
          </div>
        </div>
      )}

      {chartData.length > 0 && (
        <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
          <div style={SECTION_TITLE}>Who paid, by day</div>
          <SimpleBarChart data={chartData} seriesKeys={["Insurance paid", "Patient paid"]} colors={[TEAL, NEUTRAL_BAR]} />
        </div>
      )}

      {payerMix.length > 0 && (
        <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
          <div style={SECTION_TITLE}>Payer mix</div>
          <div style={{ display: "flex", height: 12, borderRadius: 6, overflow: "hidden", border: `1px solid ${LINE}` }}>
            {payerMix.map((d) => <div key={d.name} style={{ width: `${(d.value / mixTotal) * 100}%`, background: d.color }} />)}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 14, marginTop: 12 }}>
            {payerMix.map((d) => (
              <div key={d.name} style={{ fontSize: 12, color: INK_SOFT, display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: d.color, display: "inline-block" }} />
                {d.name} <span style={{ fontFamily: FONT_MONO, color: INK }}>{fmtMoney(d.value)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {agingTotal > 0.01 && (
        <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
          <div style={SECTION_TITLE}>Insurance aging</div>
          <div style={{ display: "flex", height: 12, borderRadius: 6, overflow: "hidden", border: `1px solid ${LINE}` }}>
            {Object.entries(aging.buckets).filter(([, v]) => v > 0.01).map(([k, v]) => (
              <div key={k} style={{ width: `${(v / agingTotal) * 100}%`, background: AGING_COLOR[k] }} />
            ))}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 14, marginTop: 12, marginBottom: aging.claims.length ? 14 : 0 }}>
            {Object.entries(aging.buckets).filter(([, v]) => v > 0.01).map(([k, v]) => (
              <div key={k} style={{ fontSize: 12, color: INK_SOFT, display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: AGING_COLOR[k], display: "inline-block" }} />
                {k} days <span style={{ fontFamily: FONT_MONO, color: INK }}>{fmtMoney(v)}</span>
              </div>
            ))}
          </div>
          {aging.claims.slice(0, 5).map((c) => (
            <div key={c.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "6px 0", borderTop: `1px solid ${LINE}` }}>
              <span style={{ color: INK_SOFT }}>{settings.hidePatients ? "•••" : (c.patient || "—")} · {fmtDate(c.date)}</span>
              <span style={{ fontFamily: FONT_MONO, color: c.days > 90 ? SIENNA : INK }}>{fmtMoney(c.pending)} · {c.days}d</span>
            </div>
          ))}
        </div>
      )}

      {byProvider.length > 1 && (
        <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
          <div style={SECTION_TITLE}>Production by provider</div>
          <SimpleHBarList data={byProvider} labelKey="name" valueKey="prod" color={TEAL} format={fmtMoney} />
        </div>
      )}

      <div style={SECTION_TITLE}>Estimated pay by provider</div>
      <div style={{ ...GLASS, overflow: "hidden", marginBottom: SP }}>
        {perProvider.map((p, i) => (
          <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 16px", borderTop: i > 0 ? `1px solid ${LINE}` : "none" }}>
            <div>
              <div style={{ fontWeight: 600, fontSize: 14 }}>{p.name}</div>
              <div style={{ fontSize: 11.5, color: INK_SOFT, marginTop: 2 }}>{p.commissionPct}% of {p.payBasis} · {p.visits} visit{p.visits === 1 ? "" : "s"}</div>
            </div>
            <div style={{ fontFamily: FONT_MONO, fontWeight: 600, color: TEAL }}>{fmtMoney(p.pay)}</div>
          </div>
        ))}
        {perProvider.length === 0 && <div style={{ padding: 14, fontSize: 13, color: INK_SOFT }}>Add a provider in Settings to estimate pay.</div>}
      </div>

      <DaySheetSection dayTotals={dayTotals} saveDayTotals={saveDayTotals} settings={settings} visits={visits} saveVisits={saveVisits} />

      {reportOpen && (
        <ReportView
          onClose={() => setReportOpen(false)}
          range={rangeLabel}
          stats={[
            { label: "Production", value: fmtMoney(cur.production) },
            { label: "Billed to insurance", value: fmtMoney(cur.insBilled) },
            { label: "Collected (insurance)", value: fmtMoney(cur.insPaid) },
            { label: "Collected (patient)", value: fmtMoney(cur.ptPaid) },
            { label: "Collected (total)", value: fmtMoney(cur.collected) },
            { label: "Outstanding", value: fmtMoney(cur.outstanding) },
            { label: "Insurance pending", value: fmtMoney(cur.insPending) },
            { label: "Net collection rate", value: cur.netRate === null ? "—" : `${cur.netRate.toFixed(1)}%` },
          ]}
          perProvider={perProvider}
          payerMix={payerMix}
        />
      )}
    </div>
  );
}

// ---------- Imported day sheets: whole-day totals kept separate from the per-visit ledger,
// for days where you only have a printed/scanned sheet rather than clean per-patient detail ----------

function DaySheetSection({ dayTotals, saveDayTotals, settings, visits, saveVisits }) {
  const [form, setForm] = useState(null);
  const [scanOpen, setScanOpen] = useState(false);
  const [lightboxId, setLightboxId] = useState(null);
  const [captureTargetId, setCaptureTargetId] = useState(null);
  const captureInputRef = useRef(null);

  const providerName = (id) => settings.providers.find((p) => p.id === id)?.name || "Unassigned";

  const startAdd = () => setForm({ id: null, date: todayISO(), office: settings.offices[0] || "", providerId: settings.providers[0]?.id || null, charges: "", insuranceBilled: "", payments: "", offsetting: "", patientsSeen: "" });
  const startEdit = (d) => setForm({ ...d, charges: String(d.charges), insuranceBilled: String(d.insuranceBilled || 0), payments: String(d.payments), offsetting: String(d.offsetting || 0), patientsSeen: String(d.patientsSeen || 0) });

  const submit = () => {
    if (!form.date || !form.charges) return;
    const rec = {
      id: form.id || uid(), date: form.date, office: form.office, providerId: form.providerId,
      charges: toNum(form.charges), insuranceBilled: toNum(form.insuranceBilled),
      payments: toNum(form.payments), offsetting: toNum(form.offsetting),
      patientsSeen: parseInt(form.patientsSeen) || 0,
      hasPhoto: form.id ? (dayTotals.find((d) => d.id === form.id)?.hasPhoto || false) : false,
    };
    saveDayTotals(form.id ? dayTotals.map((d) => (d.id === form.id ? rec : d)) : [rec, ...dayTotals]);
    setForm(null);
  };
  const remove = async (id) => {
    const d = dayTotals.find((x) => x.id === id);
    if (d?.hasPhoto) { try { await window.storage.delete(`photo:${id}`); } catch {} delete photoCache[id]; }
    saveDayTotals(dayTotals.filter((x) => x.id !== id));
  };
  const loadSeed = () => saveDayTotals([SEED_DAY_SHEET(settings), ...dayTotals]);

  const onScanConfirm = async (dayRec, imageDataUrl, extraVisits) => {
    saveDayTotals([dayRec, ...dayTotals]);
    if (imageDataUrl) {
      try { await window.storage.set(`photo:${dayRec.id}`, imageDataUrl); photoCache[dayRec.id] = imageDataUrl; } catch (e) { console.error(e); }
    }
    if (extraVisits && extraVisits.length) saveVisits([...extraVisits, ...visits]);
    setScanOpen(false);
  };

  const openCapture = (id) => { setCaptureTargetId(id); captureInputRef.current?.click(); };
  const handleCapture = async (e) => {
    const file = e.target.files?.[0]; e.target.value = "";
    if (!file || !captureTargetId) return;
    try {
      const dataUrl = await compressImage(file);
      await window.storage.set(`photo:${captureTargetId}`, dataUrl);
      photoCache[captureTargetId] = dataUrl;
      saveDayTotals(dayTotals.map((d) => (d.id === captureTargetId ? { ...d, hasPhoto: true } : d)));
    } catch (err) { console.error(err); }
  };
  const removePhoto = async (id) => {
    try { await window.storage.delete(`photo:${id}`); } catch {}
    delete photoCache[id];
    saveDayTotals(dayTotals.map((d) => (d.id === id ? { ...d, hasPhoto: false } : d)));
    setLightboxId(null);
  };

  const chartData = [...dayTotals].sort((a, b) => a.date.localeCompare(b.date)).map((d) => ({ key: d.date, Charges: d.charges, Payments: d.payments }));

  return (
    <div style={{ marginBottom: SP }}>
      <input type="file" accept="image/*" ref={captureInputRef} style={{ display: "none" }} onChange={handleCapture} />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div style={SECTION_TITLE}>Imported day sheets</div>
        {!form && (
          <div style={{ display: "flex", gap: 14 }}>
            <button onClick={() => setScanOpen(true)} style={{ border: "none", background: "none", color: TEAL, fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}><Camera size={14} />Scan (AI)</button>
            <button onClick={startAdd} style={{ border: "none", background: "none", color: TEAL, fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}><Plus size={14} />Log totals</button>
          </div>
        )}
      </div>
      <div style={{ fontSize: 11.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>
        For days you only have a printed or scanned totals sheet — kept apart from the visit ledger above so nothing double-counts.
      </div>

      {form && (
        <div style={{ ...GLASS, padding: 16, marginBottom: 14 }}>
          <Field label="Date"><input type="date" style={inputStyle} value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
          <Field label="Office">
            <select style={inputStyle} value={form.office} onChange={(e) => setForm({ ...form, office: e.target.value })}>
              {settings.offices.map((o) => <option key={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="Provider">
            <select style={inputStyle} value={form.providerId || ""} onChange={(e) => setForm({ ...form, providerId: e.target.value })}>
              {settings.providers.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="Total charges ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.charges} onChange={(e) => setForm({ ...form, charges: e.target.value })} /></Field>
          <Field label="Charges billed to insurance ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.insuranceBilled} onChange={(e) => setForm({ ...form, insuranceBilled: e.target.value })} /></Field>
          <Field label="Payments received ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.payments} onChange={(e) => setForm({ ...form, payments: e.target.value })} /></Field>
          <Field label="Offsetting adjustments ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.offsetting} onChange={(e) => setForm({ ...form, offsetting: e.target.value })} /></Field>
          <Field label="Patients seen"><input type="number" style={inputStyle} value={form.patientsSeen} onChange={(e) => setForm({ ...form, patientsSeen: e.target.value })} /></Field>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn kind="primary" onClick={submit} style={{ flex: 1 }}>{form.id ? "Save changes" : "Add totals"}</Btn>
            <Btn onClick={() => setForm(null)}>Cancel</Btn>
          </div>
        </div>
      )}

      {dayTotals.length === 0 && !form ? (
        <div style={{ border: `1.5px dashed ${TEAL}55`, borderRadius: 12, padding: "22px 16px", textAlign: "center" }}>
          <div style={{ fontSize: 13, color: INK_SOFT, marginBottom: 12 }}>Nothing logged this way yet.</div>
          <Btn onClick={loadSeed}>Load the Sep 10 scanned sheet</Btn>
        </div>
      ) : (
        <div style={{ ...GLASS, overflow: "hidden" }}>
          {dayTotals.map((d, i) => {
            const p = settings.providers.find((x) => x.id === d.providerId);
            const est = p ? (p.payBasis === "production" ? d.charges : d.payments) * (p.commissionPct / 100) : 0;
            return (
              <div key={d.id} style={{ padding: "13px 16px", borderTop: i > 0 ? `1px solid ${LINE}` : "none", display: "flex", gap: 10 }}>
                {d.hasPhoto
                  ? <PhotoThumb id={d.id} onClick={() => setLightboxId(d.id)} />
                  : (
                    <button onClick={() => openCapture(d.id)} style={{ width: 56, height: 56, borderRadius: 8, border: `1.5px dashed ${TEAL}55`, background: "#F1FAF7", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
                      <Camera size={17} color={INK_SOFT} />
                    </button>
                  )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{fmtDateLong(d.date)} · {d.office}</div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: INK_SOFT, marginTop: 5, lineHeight: 1.7 }}>
                    {fmtMoney(d.charges)} charged ({fmtMoney(d.insuranceBilled)} to ins.) · {fmtMoney(d.payments)} collected
                    {d.offsetting > 0 && <> · {fmtMoney(d.offsetting)} adjustments</>}
                    <br />{d.patientsSeen} patient{d.patientsSeen === 1 ? "" : "s"} · est. {providerName(d.providerId)} pay {fmtMoney(est)}
                  </div>
                  <div style={{ display: "flex", justifyContent: "flex-end", gap: 14, marginTop: 6 }}>
                    <button onClick={() => startEdit(d)} style={{ border: "none", background: "none", color: TEAL, fontSize: 13, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}><Pencil size={13} />Edit</button>
                    <button onClick={() => remove(d.id)} style={{ border: "none", background: "none", color: SIENNA, fontSize: 13, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}><Trash2 size={13} />Delete</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {chartData.length > 1 && (
        <div style={{ ...GLASS, padding: 16, marginTop: 14 }}>
          <SimpleBarChart data={chartData} seriesKeys={["Charges", "Payments"]} colors={[TEAL, NEUTRAL_BAR]} height={130} />
        </div>
      )}

      {lightboxId && (
        <Lightbox id={lightboxId} onClose={() => setLightboxId(null)} onReplace={() => { openCapture(lightboxId); setLightboxId(null); }} onRemove={() => removePhoto(lightboxId)} />
      )}

      {scanOpen && (
        <ScanWizard
          settings={settings}
          onClose={() => setScanOpen(false)}
          onConfirm={onScanConfirm}
          onFallback={() => { setScanOpen(false); startAdd(); }}
        />
      )}
    </div>
  );
}

// ---------- AI photo scan: sends the photo to Claude to read the totals directly off the page ----------

function ScanWizard({ settings, onClose, onConfirm, onFallback }) {
  const [status, setStatus] = useState("idle"); // idle | working | review | error
  const [imageDataUrl, setImageDataUrl] = useState(null);
  const [form, setForm] = useState(null);
  const [rawLineItems, setRawLineItems] = useState([]);
  const [addLineItems, setAddLineItems] = useState(false);
  const [notes, setNotes] = useState("");
  const [errorMsg, setErrorMsg] = useState("");
  const fileRef = useRef(null);

  const onFile = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setStatus("working");
    setErrorMsg("");
    try {
      const dataUrl = await compressImage(file, 1400, 0.85);
      setImageDataUrl(dataUrl);
      const base64 = dataUrl.split(",")[1];
      const prompt = `You are reading a photo of a dental practice management day-sheet or daily production report (from software such as Dentrix, AbelDent, Tracker, Eaglesoft, or Open Dental). Extract the report's grand totals.

Rules:
- If patient names are visible and not blacked out, scribbled over, or otherwise redacted, extract short initials only (e.g. "J.D."). If names are redacted, illegible, or you are not confident, use null for that patient rather than guessing.
- Never invent a number you can't actually read. If a total isn't visible or legible, use null for it.
- Limit "lineItems" to at most 15 entries, prioritizing the clearest ones.
- Respond with ONLY compact minified JSON, no markdown fences, no other text, matching exactly this shape:
{"date":"YYYY-MM-DD or null","office":"string or null","charges":number or null,"insuranceBilled":number or null,"payments":number or null,"offsetting":number or null,"patientsSeen":number or null,"lineItems":[{"patient":"string or null","procedure":"string or null","charge":number or null}],"confidence":"high, medium, or low","notes":"short note, e.g. mention if names were redacted or a figure was unclear"}`;

      if (!settings.apiKey && window.__standaloneApp) {
        setErrorMsg("Add your Anthropic API key in Settings first — the standalone app needs one to use AI scanning.");
        setStatus("error");
        return;
      }
      const headers = { "Content-Type": "application/json" };
      if (settings.apiKey) {
        headers["x-api-key"] = settings.apiKey;
        headers["anthropic-version"] = "2023-06-01";
        headers["anthropic-dangerous-direct-browser-access"] = "true";
      }
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers,
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
              { type: "text", text: prompt },
            ],
          }],
        }),
      });
      if (!res.ok) {
        const errBody = await res.text().catch(() => "");
        throw new Error(`API error ${res.status}: ${errBody.slice(0, 200)}`);
      }
      const data = await res.json();
      const textBlock = (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("");
      const cleaned = textBlock.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      setForm({
        date: parsed.date || todayISO(),
        office: parsed.office || settings.offices[0] || "",
        providerId: settings.providers[0]?.id || null,
        charges: parsed.charges != null ? String(parsed.charges) : "",
        insuranceBilled: parsed.insuranceBilled != null ? String(parsed.insuranceBilled) : "",
        payments: parsed.payments != null ? String(parsed.payments) : "",
        offsetting: parsed.offsetting != null ? String(parsed.offsetting) : "",
        patientsSeen: parsed.patientsSeen != null ? String(parsed.patientsSeen) : String((parsed.lineItems || []).length),
      });
      const items = (parsed.lineItems || []).filter((li) => li.charge != null);
      setRawLineItems(items);
      setAddLineItems(items.some((li) => li.patient));
      setNotes([parsed.confidence ? `Confidence: ${parsed.confidence}.` : "", parsed.notes || ""].filter(Boolean).join(" "));
      setStatus("review");
    } catch (err) {
      console.error(err);
      setErrorMsg("Couldn't read that photo automatically — the image may be unclear, or the connection dropped.");
      setStatus("error");
    }
  };

  const confirm = () => {
    if (!form) return;
    const dayRec = {
      id: uid(), date: form.date, office: form.office, providerId: form.providerId,
      charges: toNum(form.charges), insuranceBilled: toNum(form.insuranceBilled),
      payments: toNum(form.payments), offsetting: toNum(form.offsetting),
      patientsSeen: parseInt(form.patientsSeen) || 0, hasPhoto: !!imageDataUrl,
    };
    let extraVisits = [];
    if (addLineItems && rawLineItems.length) {
      extraVisits = rawLineItems.map((li) => ({
        id: uid(), date: form.date, providerId: form.providerId, office: form.office,
        patient: li.patient || "", procedure: li.procedure || "",
        charge: li.charge || 0, insuranceBilled: 0, insurancePaid: 0, patientPaid: 0, hasPhoto: false,
      }));
    }
    onConfirm(dayRec, imageDataUrl, extraVisits);
  };

  return (
    <div className="cl-no-print" style={{ position: "fixed", inset: 0, background: "rgba(21,22,27,0.35)", zIndex: 50, display: "flex", alignItems: "flex-end" }}>
      <div className="cl-sheet" style={{ background: CARD, borderRadius: "16px 16px 0 0", padding: "10px 18px 22px", width: "100%", maxHeight: "88vh", overflowY: "auto", border: `1px solid ${LINE}`, borderBottom: "none" }}>
        <div style={{ width: 38, height: 4, borderRadius: 4, background: LINE, margin: "0 auto 14px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <div style={{ fontFamily: FONT_HEAD, fontWeight: 600, fontSize: 16, display: "flex", alignItems: "center", gap: 8, color: INK }}>
            <Camera size={17} color={TEAL} />Scan a day sheet
          </div>
          <button onClick={onClose} style={{ border: "none", background: "none", fontSize: 20, color: INK_SOFT, cursor: "pointer" }}><X size={20} /></button>
        </div>

        {status === "idle" && (
          <>
            <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 14, lineHeight: 1.5 }}>
              Take a photo (or upload one) of a printed day sheet. This sends the image to Claude to read the totals
              directly — needs an internet connection, and works right here in this app; it won't work once the file
              is downloaded and run elsewhere. You'll get a chance to review and correct everything before it's saved.
            </div>
            <Btn kind="primary" onClick={() => fileRef.current?.click()} style={{ width: "100%" }}><Camera size={15} />Take or choose a photo</Btn>
            <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onFile} />
          </>
        )}

        {status === "working" && (
          <div style={{ textAlign: "center", padding: "30px 0" }}>
            {imageDataUrl && <img src={imageDataUrl} alt="" style={{ maxWidth: "60%", maxHeight: 140, borderRadius: 8, marginBottom: 14, border: `1px solid ${LINE}` }} />}
            <div style={{ fontSize: 13, color: INK_SOFT }}>Reading the photo…</div>
          </div>
        )}

        {status === "error" && (
          <>
            <div style={{ color: SIENNA, fontSize: 13, marginBottom: 14, lineHeight: 1.5 }}>{errorMsg}</div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={() => setStatus("idle")}>Try again</Btn>
              <Btn kind="primary" onClick={onFallback} style={{ flex: 1 }}>Log totals by hand</Btn>
            </div>
          </>
        )}

        {status === "review" && form && (
          <>
            {imageDataUrl && <img src={imageDataUrl} alt="" style={{ width: "100%", maxHeight: 160, objectFit: "cover", borderRadius: 8, marginBottom: 12, border: `1px solid ${LINE}` }} />}
            {notes && <div style={{ fontSize: 12, color: GOLD, marginBottom: 12, lineHeight: 1.5 }}>{notes} Double-check the figures below before saving.</div>}
            <Field label="Date"><input type="date" style={inputStyle} value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="Office">
              <select style={inputStyle} value={form.office} onChange={(e) => setForm({ ...form, office: e.target.value })}>
                {settings.offices.map((o) => <option key={o}>{o}</option>)}
              </select>
            </Field>
            <Field label="Provider">
              <select style={inputStyle} value={form.providerId || ""} onChange={(e) => setForm({ ...form, providerId: e.target.value })}>
                {settings.providers.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </Field>
            <Field label="Total charges ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.charges} onChange={(e) => setForm({ ...form, charges: e.target.value })} /></Field>
            <Field label="Charges billed to insurance ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.insuranceBilled} onChange={(e) => setForm({ ...form, insuranceBilled: e.target.value })} /></Field>
            <Field label="Payments received ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.payments} onChange={(e) => setForm({ ...form, payments: e.target.value })} /></Field>
            <Field label="Offsetting adjustments ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.offsetting} onChange={(e) => setForm({ ...form, offsetting: e.target.value })} /></Field>
            <Field label="Patients seen"><input type="number" style={inputStyle} value={form.patientsSeen} onChange={(e) => setForm({ ...form, patientsSeen: e.target.value })} /></Field>

            {rawLineItems.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginBottom: 8 }}>
                  <input type="checkbox" checked={addLineItems} onChange={(e) => setAddLineItems(e.target.checked)} />
                  Also add {rawLineItems.length} line{rawLineItems.length === 1 ? "" : "s"} as individual visits
                </label>
                <div style={{ border: `1px solid ${LINE}`, borderRadius: 8, overflow: "hidden" }}>
                  {rawLineItems.map((li, i) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 10px", fontSize: 12, borderTop: i > 0 ? `1px solid ${LINE}` : "none", color: INK_SOFT }}>
                      <span>{li.patient || "—"} {li.procedure ? `· ${li.procedure}` : ""}</span>
                      <span style={{ fontFamily: FONT_MONO, color: INK }}>{fmtMoney(li.charge || 0)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={onClose}>Cancel</Btn>
              <Btn kind="primary" onClick={confirm} style={{ flex: 1 }}>Save</Btn>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

const emptyForm = (settings) => ({
  id: null, date: todayISO(), providerId: settings.providers[0]?.id || null, office: settings.offices[0] || "",
  patient: "", procedure: "", charge: "", insuranceBilled: "", insurancePaid: "", patientPaid: "",
});

const SORT_COLS = [
  { key: "date", label: "Date" },
  { key: "patient", label: "Patient" },
  { key: "procedure", label: "Procedure" },
  { key: "charge", label: "Charge" },
  { key: "insurancePaid", label: "Ins. paid" },
  { key: "patientPaid", label: "Pt. paid" },
  { key: "status", label: "Status" },
];

function Ledger({ visits, saveVisits, deleted, saveDeleted, settings, saveSettings, navH, dayTotals, saveDayTotals }) {
  const [search, setSearch] = useState("");
  const [officeFilter, setOfficeFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");
  const [providerFilter, setProviderFilter] = useState("All");
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(emptyForm(settings));
  const [importOpen, setImportOpen] = useState(false);
  const [scanOpen, setScanOpen] = useState(false);
  const [toast, setToast] = useState("");
  const [lightboxId, setLightboxId] = useState(null);
  const [captureTargetId, setCaptureTargetId] = useState(null);
  const [view, setView] = useState("list"); // list | table
  const [sortKey, setSortKey] = useState("date");
  const [sortDir, setSortDir] = useState("desc");
  const captureInputRef = useRef(null);

  const providerName = (id) => settings.providers.find((p) => p.id === id)?.name || "Unassigned";

  const onScanConfirm = async (dayRec, imageDataUrl, extraVisits) => {
    saveDayTotals([dayRec, ...dayTotals]);
    if (imageDataUrl) {
      try { await window.storage.set(`photo:${dayRec.id}`, imageDataUrl); photoCache[dayRec.id] = imageDataUrl; } catch (e) { console.error(e); }
    }
    if (extraVisits && extraVisits.length) saveVisits([...extraVisits, ...visits]);
    setScanOpen(false);
    setToast(extraVisits && extraVisits.length ? `Added ${extraVisits.length} visit${extraVisits.length === 1 ? "" : "s"} from the scan.` : "Saved the scanned totals to Imported day sheets.");
    setTimeout(() => setToast(""), 4500);
  };

  const withPhotos = [...visits].filter((v) => v.hasPhoto).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 15);

  const sortVal = (v, key) => {
    if (key === "status") return statusOf(v);
    if (key === "patient" || key === "procedure") return (v[key] || "").toLowerCase();
    return v[key];
  };

  const filtered = visits
    .filter((v) => officeFilter === "All" || v.office === officeFilter)
    .filter((v) => providerFilter === "All" || v.providerId === providerFilter)
    .filter((v) => statusFilter === "All" || statusOf(v) === statusFilter)
    .filter((v) => !search.trim() || v.patient.toLowerCase().includes(search.toLowerCase()) || v.procedure.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => {
      const av = sortVal(a, sortKey), bv = sortVal(b, sortKey);
      const cmp = typeof av === "string" ? av.localeCompare(bv) : av - bv;
      return sortDir === "asc" ? cmp : -cmp;
    });

  const toggleSort = (key) => {
    if (key === sortKey) setSortDir(sortDir === "asc" ? "desc" : "asc");
    else { setSortKey(key); setSortDir(key === "patient" || key === "procedure" || key === "status" ? "asc" : "desc"); }
  };

  const startAdd = () => { setForm(emptyForm(settings)); setShowForm(true); };
  const startEdit = (v) => { setForm({ ...v, charge: String(v.charge), insuranceBilled: String(v.insuranceBilled || 0), insurancePaid: String(v.insurancePaid || 0), patientPaid: String(v.patientPaid || 0) }); setShowForm(true); };

  const submitForm = () => {
    if (!form.date || !form.patient.trim()) return;
    const rec = {
      id: form.id || uid(), date: form.date, providerId: form.providerId, office: form.office,
      patient: form.patient.trim(), procedure: form.procedure.trim(),
      charge: toNum(form.charge), insuranceBilled: toNum(form.insuranceBilled),
      insurancePaid: toNum(form.insurancePaid), patientPaid: toNum(form.patientPaid),
      hasPhoto: form.id ? (visits.find((v) => v.id === form.id)?.hasPhoto || false) : false,
    };
    saveVisits(form.id ? visits.map((v) => (v.id === form.id ? rec : v)) : [rec, ...visits]);
    setShowForm(false);
  };

  const removeVisit = (v) => {
    saveVisits(visits.filter((x) => x.id !== v.id));
    saveDeleted([{ ...v, deletedAt: new Date().toISOString() }, ...deleted]);
  };
  const loadSample = () => saveVisits([...SAMPLE_VISITS(), ...visits]);

  const exportCSV = () => {
    const rows = visits.map((v) => ({
      date: v.date, provider: providerName(v.providerId), office: v.office,
      patient: settings.hidePatients ? "" : v.patient, procedure: v.procedure,
      charge: v.charge, insurance_billed: v.insuranceBilled || 0, insurance_paid: v.insurancePaid || 0,
      patient_paid: v.patientPaid || 0, total_paid: totalPaid(v), outstanding: Math.max(0, v.charge - totalPaid(v)), status: statusOf(v),
    }));
    const blob = new Blob([Papa.unparse(rows)], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `chairside-ledger-${todayISO()}.csv`; a.click();
  };

  const finishImport = (rows, count) => {
    saveVisits([...rows, ...visits]);
    setImportOpen(false);
    setToast(`Imported ${count} visit${count === 1 ? "" : "s"}.`);
    setTimeout(() => setToast(""), 4000);
  };

  const openCapture = (id) => { setCaptureTargetId(id); captureInputRef.current?.click(); };
  const handleCaptureChange = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file || !captureTargetId) return;
    try {
      const dataUrl = await compressImage(file);
      await window.storage.set(`photo:${captureTargetId}`, dataUrl);
      photoCache[captureTargetId] = dataUrl;
      saveVisits(visits.map((v) => (v.id === captureTargetId ? { ...v, hasPhoto: true } : v)));
    } catch (err) { console.error(err); }
  };
  const removePhoto = async (id) => {
    try { await window.storage.delete(`photo:${id}`); } catch {}
    delete photoCache[id];
    saveVisits(visits.map((v) => (v.id === id ? { ...v, hasPhoto: false } : v)));
    setLightboxId(null);
  };

  return (
    <div>
      <input type="file" accept="image/*" ref={captureInputRef} style={{ display: "none" }} onChange={handleCaptureChange} />

      {withPhotos.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11.5, color: INK_SOFT, marginBottom: 6, fontFamily: FONT_HEAD, fontWeight: 600 }}>Recent photos</div>
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
            {withPhotos.map((v) => (
              <div key={v.id} style={{ flexShrink: 0 }}>
                <PhotoThumb id={v.id} size={64} onClick={() => setLightboxId(v.id)} />
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ position: "relative", marginBottom: 8 }}>
        <Search size={16} color={INK_SOFT} style={{ position: "absolute", left: 11, top: 12 }} />
        <input style={{ ...inputStyle, paddingLeft: 34 }} placeholder="Search patient or procedure" value={search} onChange={(e) => setSearch(e.target.value)} />
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        <select style={{ ...inputStyle, width: "auto", flex: 1 }} value={officeFilter} onChange={(e) => setOfficeFilter(e.target.value)}>
          <option>All</option>{settings.offices.map((o) => <option key={o}>{o}</option>)}
        </select>
        <select style={{ ...inputStyle, width: "auto", flex: 1 }} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option>All</option><option>Paid</option><option>Partial</option><option>Unpaid</option><option>No charge</option>
        </select>
        <select style={{ ...inputStyle, width: "auto", flex: 1 }} value={providerFilter} onChange={(e) => setProviderFilter(e.target.value)}>
          <option value="All">All</option>{settings.providers.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>

      {showForm && (
        <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
          <Field label="Date"><input type="date" style={inputStyle} value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
          <Field label="Provider">
            <select style={inputStyle} value={form.providerId || ""} onChange={(e) => setForm({ ...form, providerId: e.target.value })}>
              {settings.providers.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="Office">
            <select style={inputStyle} value={form.office} onChange={(e) => setForm({ ...form, office: e.target.value })}>
              {settings.offices.map((o) => <option key={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="Patient (initials recommended)"><input style={inputStyle} value={form.patient} onChange={(e) => setForm({ ...form, patient: e.target.value })} /></Field>

          {settings.presets.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 11.5, color: INK_SOFT, marginBottom: 6, fontFamily: FONT_MONO }}>Quick fill</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {settings.presets.map((pr) => (
                  <button key={pr.id} type="button" onClick={() => setForm({ ...form, procedure: pr.procedure, charge: String(pr.charge), insuranceBilled: String(pr.insuranceBilled || 0) })} style={{
                    padding: "6px 10px", borderRadius: 20, border: `1px solid ${LINE}`, background: "#F1FAF7",
                    fontSize: 12, color: INK, cursor: "pointer", fontFamily: FONT_BODY,
                  }}>
                    {pr.procedure} · {fmtMoney(pr.charge)}
                  </button>
                ))}
              </div>
            </div>
          )}

          <Field label="Procedure"><input style={inputStyle} value={form.procedure} onChange={(e) => setForm({ ...form, procedure: e.target.value })} /></Field>
          <Field label="Total charge ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.charge} onChange={(e) => setForm({ ...form, charge: e.target.value })} /></Field>
          <Field label="Billed to insurance ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.insuranceBilled} onChange={(e) => setForm({ ...form, insuranceBilled: e.target.value })} /></Field>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}><Field label="Insurance paid ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.insurancePaid} onChange={(e) => setForm({ ...form, insurancePaid: e.target.value })} /></Field></div>
            <div style={{ flex: 1 }}><Field label="Patient paid ($)"><input type="number" inputMode="decimal" style={inputStyle} value={form.patientPaid} onChange={(e) => setForm({ ...form, patientPaid: e.target.value })} /></Field></div>
          </div>
          {form.id && (
            <div style={{ fontSize: 11.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>
              Attach or replace a photo from the visit row after saving — tap the thumbnail or camera icon.
            </div>
          )}
          <div style={{ display: "flex", gap: 8 }}>
            <Btn kind="primary" onClick={submitForm} style={{ flex: 1 }}>{form.id ? "Save changes" : "Add visit"}</Btn>
            <Btn onClick={() => setShowForm(false)}>Cancel</Btn>
          </div>
        </div>
      )}

      {search.trim() && filtered.length > 0 && (
        <div style={{ ...GLASS, padding: "10px 14px", marginBottom: 10, display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12 }}>
          <span style={{ color: INK_SOFT }}>{filtered.length} match{filtered.length === 1 ? "" : "es"} for "{search.trim()}"</span>
          <span style={{ color: INK_SOFT }}>Charged <b style={{ fontFamily: FONT_MONO, color: INK }}>{fmtMoney(filtered.reduce((s, v) => s + (v.charge || 0), 0))}</b></span>
          <span style={{ color: INK_SOFT }}>Collected <b style={{ fontFamily: FONT_MONO, color: INK }}>{fmtMoney(filtered.reduce((s, v) => s + totalPaid(v), 0))}</b></span>
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ fontSize: 12.5, color: INK_SOFT }}>{filtered.length} visit{filtered.length === 1 ? "" : "s"}</div>
        <div style={{ display: "flex", background: "#E3F3EE", borderRadius: 12, padding: 3, gap: 3 }}>
          {["list", "table"].map((v) => (
            <button key={v} onClick={() => setView(v)} style={{
              padding: "5px 12px", borderRadius: 9, fontSize: 11.5, fontWeight: 700, cursor: "pointer", border: "none",
              background: view === v ? GRAD_PRIMARY : "transparent",
              boxShadow: view === v ? "0 2px 8px -2px rgba(108,92,231,0.5)" : "none",
              color: view === v ? ON_ACCENT : INK_SOFT, textTransform: "capitalize", fontFamily: FONT_BODY,
            }}>{v}</button>
          ))}
        </div>
      </div>

      {filtered.length === 0 ? (
        <div style={{ border: `1.5px dashed ${TEAL}55`, borderRadius: 12, padding: "30px 16px", textAlign: "center" }}>
          <Inbox size={24} color={INK_SOFT} style={{ marginBottom: 8 }} />
          <div style={{ fontFamily: FONT_HEAD, fontWeight: 600, fontSize: 15, marginBottom: 6, color: INK }}>No visits here yet</div>
          <div style={{ fontSize: 13, color: INK_SOFT, marginBottom: 14, lineHeight: 1.5 }}>Log your next visit, import a day sheet, or try a different filter.</div>
          {visits.length === 0 && <Btn onClick={loadSample}>Load sample data</Btn>}
        </div>
      ) : view === "table" ? (
        <div style={{ ...GLASS, overflow: "hidden", marginBottom: SP }}>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, minWidth: 560 }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${LINE}`, background: "#FBFAF7" }}>
                  {SORT_COLS.map((c) => (
                    <th key={c.key} onClick={() => toggleSort(c.key)} style={{
                      textAlign: c.key === "charge" || c.key === "insurancePaid" || c.key === "patientPaid" ? "right" : "left",
                      padding: "8px 10px", cursor: "pointer", color: sortKey === c.key ? TEAL : INK_SOFT,
                      fontWeight: 600, fontFamily: FONT_HEAD, whiteSpace: "nowrap", userSelect: "none",
                    }}>
                      {c.label}{sortKey === c.key ? (sortDir === "asc" ? " ▲" : " ▼") : ""}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((v) => {
                  const st = statusOf(v);
                  return (
                    <tr key={v.id} onClick={() => startEdit(v)} style={{ borderBottom: `1px solid ${LINE}`, cursor: "pointer" }}>
                      <td style={{ padding: "7px 10px", fontFamily: FONT_MONO, color: INK_SOFT, whiteSpace: "nowrap" }}>{fmtDate(v.date)}</td>
                      <td style={{ padding: "7px 10px", fontWeight: 600 }}>{settings.hidePatients ? "•••" : (v.patient || "—")}</td>
                      <td style={{ padding: "7px 10px", color: INK_SOFT, maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{v.procedure || "—"}</td>
                      <td style={{ padding: "7px 10px", fontFamily: FONT_MONO, textAlign: "right" }}>{fmtMoney(v.charge)}</td>
                      <td style={{ padding: "7px 10px", fontFamily: FONT_MONO, textAlign: "right", color: INK_SOFT }}>{fmtMoney(v.insurancePaid || 0)}</td>
                      <td style={{ padding: "7px 10px", fontFamily: FONT_MONO, textAlign: "right", color: INK_SOFT }}>{fmtMoney(v.patientPaid || 0)}</td>
                      <td style={{ padding: "7px 10px" }}>
                        <span style={{ fontSize: 10.5, fontWeight: 700, padding: "3px 9px", borderRadius: 20, color: ON_ACCENT, background: STATUS_COLOR[st], whiteSpace: "nowrap" }}>{st}</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{ fontSize: 11, color: INK_SOFT, padding: "8px 12px", borderTop: `1px solid ${LINE}` }}>Tap a row to edit. Tap a column heading to sort.</div>
        </div>
      ) : (
        <div style={{ ...GLASS, overflow: "hidden", marginBottom: SP }}>
          {filtered.map((v, i) => {
            const st = statusOf(v);
            const pending = Math.max(0, (v.insuranceBilled || 0) - (v.insurancePaid || 0));
            return (
              <div key={v.id} style={{ padding: "13px 16px", borderTop: i > 0 ? `1px solid ${LINE}` : "none", display: "flex", gap: 10 }}>
                {v.hasPhoto
                  ? <PhotoThumb id={v.id} onClick={() => setLightboxId(v.id)} />
                  : (
                    <button onClick={() => openCapture(v.id)} style={{
                      width: 56, height: 56, borderRadius: 8, border: `1.5px dashed ${TEAL}55`, background: "#F1FAF7",
                      display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0,
                    }}>
                      <Camera size={17} color={INK_SOFT} />
                    </button>
                  )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 11.5, color: INK_SOFT, fontFamily: FONT_MONO }}>{fmtDateLong(v.date)} · {providerName(v.providerId)} · {v.office}</div>
                      <div style={{ fontWeight: 600, fontSize: 14.5, marginTop: 3 }}>
                        {settings.hidePatients ? "•••" : (v.patient || "—")}
                        {v.procedure && <span style={{ fontWeight: 400, color: INK_SOFT }}> — {v.procedure}</span>}
                      </div>
                    </div>
                    <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20, color: ON_ACCENT, background: STATUS_COLOR[st], whiteSpace: "nowrap", marginLeft: 8 }}>{st}</span>
                  </div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 12.5, marginTop: 8, color: INK_SOFT, lineHeight: 1.7 }}>
                    {fmtMoney(v.charge)} charged
                    {v.insuranceBilled > 0 && <> · {fmtMoney(v.insuranceBilled)} billed to ins.</>}
                    <br />
                    {fmtMoney(v.insurancePaid || 0)} from ins. + {fmtMoney(v.patientPaid || 0)} from patient
                    {pending > 0 && <span style={{ color: GOLD }}> · {fmtMoney(pending)} ins. pending</span>}
                  </div>
                  <div style={{ display: "flex", justifyContent: "flex-end", gap: 14, marginTop: 6 }}>
                    <button onClick={() => startEdit(v)} style={{ border: "none", background: "none", color: TEAL, fontSize: 13, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}><Pencil size={13} />Edit</button>
                    <button onClick={() => removeVisit(v)} style={{ border: "none", background: "none", color: SIENNA, fontSize: 13, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}><Trash2 size={13} />Delete</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <Btn kind="primary" onClick={() => setScanOpen(true)}><Camera size={15} />Scan (AI)</Btn>
        <Btn onClick={() => setImportOpen(true)}><FileSpreadsheet size={15} />Import day sheet</Btn>
        <Btn onClick={exportCSV}><Download size={15} />Export CSV</Btn>
      </div>
      {toast && <div style={{ fontSize: 12.5, color: TEAL, marginTop: 8 }}>{toast}</div>}

      {lightboxId && (
        <Lightbox
          id={lightboxId}
          onClose={() => setLightboxId(null)}
          onReplace={() => { openCapture(lightboxId); setLightboxId(null); }}
          onRemove={() => removePhoto(lightboxId)}
        />
      )}

      {importOpen && <ImportWizard settings={settings} saveSettings={saveSettings} onClose={() => setImportOpen(false)} onImport={finishImport} />}

      {scanOpen && (
        <ScanWizard
          settings={settings}
          onClose={() => setScanOpen(false)}
          onConfirm={onScanConfirm}
          onFallback={() => { setScanOpen(false); startAdd(); }}
        />
      )}

      {!showForm && <Fab onClick={startAdd}><Plus size={22} /></Fab>}
    </div>
  );
}

// ---------- Import wizard ----------

function ImportWizard({ settings, saveSettings, onClose, onImport }) {
  const [step, setStep] = useState(1);
  const [rawText, setRawText] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [profileName, setProfileName] = useState("");
  const [error, setError] = useState("");
  const fileRef = useRef(null);

  const parse = (text) => {
    const res = Papa.parse(text.trim(), { header: true, skipEmptyLines: true, dynamicTyping: false });
    if (!res.meta.fields || res.meta.fields.length < 2) {
      setError("Couldn't find column headers. Make sure the first row has field names (Date, Patient, Charge, etc).");
      return;
    }
    setError("");
    setHeaders(res.meta.fields);
    setRows(res.data);
    setMapping(guessMapping(res.meta.fields));
    setStep(2);
  };

  const onFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => parse(reader.result);
    reader.readAsText(f);
  };

  const applyProfile = (name) => {
    const prof = settings.importProfiles.find((p) => p.name === name);
    if (!prof) return;
    const m = {};
    FIELD_DEFS.forEach((f) => { m[f.key] = headers.includes(prof.map[f.key]) ? prof.map[f.key] : ""; });
    setMapping(m);
  };

  const saveProfile = () => {
    if (!profileName.trim()) return;
    const next = [...settings.importProfiles.filter((p) => p.name !== profileName.trim()), { name: profileName.trim(), map: mapping }];
    saveSettings({ ...settings, importProfiles: next });
    setProfileName("");
  };

  const doImport = () => {
    const providerByName = {};
    settings.providers.forEach((p) => (providerByName[p.name.toLowerCase()] = p.id));
    const mapped = rows.map((r) => {
      const date = mapping.date ? toISODate(r[mapping.date]) : null;
      const charge = mapping.charge ? toNum(r[mapping.charge]) : 0;
      if (!date || (!charge && !mapping.insurancePaid && !mapping.patientPaid)) return null;
      return {
        id: uid(), date,
        providerId: (mapping.provider && providerByName[(r[mapping.provider] || "").toLowerCase()]) || settings.providers[0]?.id || null,
        office: (mapping.office && r[mapping.office]) || settings.offices[0] || "",
        patient: (mapping.patient && r[mapping.patient]) || "",
        procedure: (mapping.procedure && r[mapping.procedure]) || "",
        charge,
        insuranceBilled: mapping.insuranceBilled ? toNum(r[mapping.insuranceBilled]) : 0,
        insurancePaid: mapping.insurancePaid ? toNum(r[mapping.insurancePaid]) : 0,
        patientPaid: mapping.patientPaid ? toNum(r[mapping.patientPaid]) : 0,
        hasPhoto: false,
      };
    }).filter(Boolean);
    onImport(mapped, mapped.length);
  };

  return (
    <div className="cl-no-print" style={{ position: "fixed", inset: 0, background: "rgba(21,22,27,0.35)", zIndex: 50, display: "flex", alignItems: "flex-end" }}>
      <div className="cl-sheet" style={{ background: CARD, borderRadius: "16px 16px 0 0", padding: "10px 18px 18px", width: "100%", maxHeight: "88vh", overflowY: "auto", border: `1px solid ${LINE}`, borderBottom: "none" }}>
        <div style={{ width: 38, height: 4, borderRadius: 4, background: LINE, margin: "0 auto 14px" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <div style={{ fontFamily: FONT_HEAD, fontWeight: 600, fontSize: 16, display: "flex", alignItems: "center", gap: 8, color: INK }}>
            <FileSpreadsheet size={17} color={TEAL} />Import a day sheet
          </div>
          <button onClick={onClose} style={{ border: "none", background: "none", fontSize: 20, color: INK_SOFT, cursor: "pointer" }}><X size={20} /></button>
        </div>

        {step === 1 && (
          <>
            <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 12, lineHeight: 1.5 }}>
              Works with a CSV export from Dentrix, AbelDent, Tracker, Eaglesoft, Open Dental or similar — or a grid copied
              straight out of the report and pasted below. Column names vary by software and report type, so you'll confirm
              the mapping on the next step (and can save it for next time).
            </div>
            <div style={{ fontSize: 11.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>
              Note: this reads text-based exports, not scanned photos of a printed day sheet — if that's all you have, share
              the photo in chat first and ask for a CSV made from it.
            </div>
            <Btn onClick={() => fileRef.current?.click()} style={{ width: "100%", marginBottom: 10 }}><Upload size={15} />Upload CSV / TSV file</Btn>
            <input ref={fileRef} type="file" accept=".csv,.tsv,.txt" style={{ display: "none" }} onChange={onFile} />
            <div style={{ fontSize: 12, color: INK_SOFT, margin: "6px 0" }}>— or paste the report below —</div>
            <textarea rows={6} style={{ ...inputStyle, fontFamily: FONT_MONO, fontSize: 12.5 }}
              placeholder="Date, Patient, Procedure, Charge, Ins Billed, Ins Paid, Patient Paid..."
              value={rawText} onChange={(e) => setRawText(e.target.value)} />
            {error && <div style={{ color: SIENNA, fontSize: 12.5, marginTop: 8 }}>{error}</div>}
            <Btn kind="primary" onClick={() => parse(rawText)} disabled={!rawText.trim()} style={{ width: "100%", marginTop: 10 }}>Parse pasted text</Btn>
          </>
        )}

        {step === 2 && (
          <>
            {settings.importProfiles.length > 0 && (
              <Field label="Use a saved mapping">
                <select style={inputStyle} defaultValue="" onChange={(e) => e.target.value && applyProfile(e.target.value)}>
                  <option value="">— choose a saved profile —</option>
                  {settings.importProfiles.map((p) => <option key={p.name} value={p.name}>{p.name}</option>)}
                </select>
              </Field>
            )}
            <div style={{ fontSize: 12, color: INK_SOFT, marginBottom: 10 }}>
              Found {headers.length} columns and {rows.length} rows. Match each field below (leave blank if not present).
            </div>
            {FIELD_DEFS.map((f) => (
              <Field key={f.key} label={f.label}>
                <select style={inputStyle} value={mapping[f.key] || ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value })}>
                  <option value="">— not in file —</option>
                  {headers.map((h) => <option key={h} value={h}>{h}</option>)}
                </select>
              </Field>
            ))}
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <input style={{ ...inputStyle, flex: 1 }} placeholder="Name this mapping (e.g. Dentrix day sheet)" value={profileName} onChange={(e) => setProfileName(e.target.value)} />
              <Btn onClick={saveProfile}>Save mapping</Btn>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={() => setStep(1)}>Back</Btn>
              <Btn kind="primary" onClick={doImport} disabled={!mapping.date} style={{ flex: 1 }}>Import {rows.length} rows</Btn>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ---------- Settings ----------

function Settings({ settings, saveSettings, visits, saveVisits, deleted, saveDeleted }) {
  const [local, setLocal] = useState(settings);
  const [newOffice, setNewOffice] = useState("");
  const [savedMsg, setSavedMsg] = useState("");
  const [newPreset, setNewPreset] = useState({ procedure: "", charge: "", insuranceBilled: "" });
  const [pinNew, setPinNew] = useState("");
  const [pinConfirm, setPinConfirm] = useState("");
  const [pinMsg, setPinMsg] = useState("");
  const backupInputRef = useRef(null);

  useEffect(() => setLocal(settings), [settings]);

  const updateProvider = (id, patch) => setLocal({ ...local, providers: local.providers.map((p) => (p.id === id ? { ...p, ...patch } : p)) });
  const addProvider = () => setLocal({ ...local, providers: [...local.providers, { id: uid(), name: "New provider", commissionPct: 40, payBasis: "collections" }] });
  const removeProvider = (id) => setLocal({ ...local, providers: local.providers.filter((p) => p.id !== id) });
  const addOffice = () => { if (!newOffice.trim() || local.offices.includes(newOffice.trim())) return; setLocal({ ...local, offices: [...local.offices, newOffice.trim()] }); setNewOffice(""); };
  const removeOffice = (o) => setLocal({ ...local, offices: local.offices.filter((x) => x !== o) });
  const removeProfile = (name) => setLocal({ ...local, importProfiles: local.importProfiles.filter((p) => p.name !== name) });

  const addPreset = () => {
    if (!newPreset.procedure.trim() || !newPreset.charge) return;
    setLocal({ ...local, presets: [...local.presets, { id: uid(), procedure: newPreset.procedure.trim(), charge: toNum(newPreset.charge), insuranceBilled: toNum(newPreset.insuranceBilled) }] });
    setNewPreset({ procedure: "", charge: "", insuranceBilled: "" });
  };
  const removePreset = (id) => setLocal({ ...local, presets: local.presets.filter((p) => p.id !== id) });

  const setPin = async () => {
    if (pinNew.length < 4) { setPinMsg("Use at least 4 digits."); return; }
    if (pinNew !== pinConfirm) { setPinMsg("PINs don't match."); return; }
    const hash = await sha256(pinNew);
    setLocal({ ...local, pinHash: hash });
    setPinNew(""); setPinConfirm(""); setPinMsg("PIN set — tap Save settings below to apply it.");
  };
  const removePin = () => { setLocal({ ...local, pinHash: null }); setPinMsg("PIN removed — tap Save settings below to apply it."); };

  const save = () => { saveSettings(local); setSavedMsg("Settings saved."); setTimeout(() => setSavedMsg(""), 3000); };

  const downloadBackup = () => {
    const data = { visits, deleted, settings, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `chairside-ledger-backup-${todayISO()}.json`; a.click();
  };
  const restoreBackup = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.visits) saveVisits(data.visits);
        if (data.deleted) saveDeleted(data.deleted);
        if (data.settings) { saveSettings(data.settings); setLocal(data.settings); }
        setSavedMsg("Backup restored."); setTimeout(() => setSavedMsg(""), 3000);
      } catch { setSavedMsg("Couldn't read that file."); }
    };
    reader.readAsText(file); e.target.value = "";
  };
  const restoreVisit = (v) => { saveDeleted(deleted.filter((x) => x.id !== v.id)); const { deletedAt, ...rest } = v; saveVisits([rest, ...visits]); };
  const emptyTrash = async () => {
    for (const v of deleted) { if (v.hasPhoto) { try { await window.storage.delete(`photo:${v.id}`); } catch {} delete photoCache[v.id]; } }
    saveDeleted([]);
  };

  return (
    <div>
      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>Providers & commission</div>
        <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 12, lineHeight: 1.5 }}>Each provider can run their own rate and pay basis.</div>
        {local.providers.map((p) => (
          <div key={p.id} style={{ borderTop: `1px solid ${LINE}`, paddingTop: 10, marginTop: 10 }}>
            <Field label="Name"><input style={inputStyle} value={p.name} onChange={(e) => updateProvider(p.id, { name: e.target.value })} /></Field>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}><Field label="Commission (%)"><input type="number" style={inputStyle} value={p.commissionPct} onChange={(e) => updateProvider(p.id, { commissionPct: parseFloat(e.target.value) || 0 })} /></Field></div>
              <div style={{ flex: 1 }}><Field label="Pay basis">
                <select style={inputStyle} value={p.payBasis} onChange={(e) => updateProvider(p.id, { payBasis: e.target.value })}>
                  <option value="collections">Collections</option><option value="production">Production</option>
                </select>
              </Field></div>
            </div>
            {local.providers.length > 1 && <button onClick={() => removeProvider(p.id)} style={{ border: "none", background: "none", color: SIENNA, fontSize: 12.5, cursor: "pointer", fontWeight: 600 }}>Remove provider</button>}
          </div>
        ))}
        <Btn onClick={addProvider} style={{ marginTop: 12 }}><Plus size={14} />Add provider</Btn>
      </div>

      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>Pay period</div>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Field label="Start date"><input type="date" style={inputStyle} value={local.payPeriodStart} onChange={(e) => setLocal({ ...local, payPeriodStart: e.target.value })} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Length (days)"><input type="number" style={inputStyle} value={local.payPeriodLength} onChange={(e) => setLocal({ ...local, payPeriodLength: parseInt(e.target.value) || 14 })} /></Field></div>
        </div>
      </div>

      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>Goal</div>
        <Field label="Monthly production goal ($)"><input type="number" inputMode="decimal" style={inputStyle} value={local.monthlyProductionGoal || ""} onChange={(e) => setLocal({ ...local, monthlyProductionGoal: toNum(e.target.value) })} /></Field>
        <div style={{ fontSize: 11.5, color: INK_SOFT, lineHeight: 1.5 }}>Shows a progress bar on Overview against this calendar month's production. Set to 0 to hide it.</div>
      </div>

      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>Quick-add presets</div>
        <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>Common procedures you log often — one tap fills procedure, charge, and insurance billed when adding a visit.</div>
        {local.presets.map((pr) => (
          <div key={pr.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: `1px solid ${LINE}` }}>
            <span style={{ fontSize: 13 }}>{pr.procedure} — {fmtMoney(pr.charge)}{pr.insuranceBilled > 0 ? ` (${fmtMoney(pr.insuranceBilled)} to ins.)` : ""}</span>
            <button onClick={() => removePreset(pr.id)} style={{ border: "none", background: "none", color: SIENNA, cursor: "pointer" }}><X size={16} /></button>
          </div>
        ))}
        <div style={{ marginTop: 10 }}>
          <Field label="Procedure name"><input style={inputStyle} value={newPreset.procedure} onChange={(e) => setNewPreset({ ...newPreset, procedure: e.target.value })} /></Field>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1 }}><Field label="Charge ($)"><input type="number" inputMode="decimal" style={inputStyle} value={newPreset.charge} onChange={(e) => setNewPreset({ ...newPreset, charge: e.target.value })} /></Field></div>
            <div style={{ flex: 1 }}><Field label="Billed to insurance ($)"><input type="number" inputMode="decimal" style={inputStyle} value={newPreset.insuranceBilled} onChange={(e) => setNewPreset({ ...newPreset, insuranceBilled: e.target.value })} /></Field></div>
          </div>
          <Btn onClick={addPreset}><Plus size={14} />Add preset</Btn>
        </div>
      </div>

      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5, display: "flex", alignItems: "center", gap: 7 }}><Building2 size={16} color={INK_SOFT} />Offices</div>
        {local.offices.map((o) => (
          <div key={o} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: `1px solid ${LINE}` }}>
            <span style={{ fontSize: 14 }}>{o}</span>
            <button onClick={() => removeOffice(o)} style={{ border: "none", background: "none", color: SIENNA, cursor: "pointer" }}><X size={16} /></button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <input style={{ ...inputStyle, flex: 1 }} placeholder="Office name" value={newOffice} onChange={(e) => setNewOffice(e.target.value)} />
          <Btn onClick={addOffice}>Add</Btn>
        </div>
      </div>

      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>Saved day-sheet mappings</div>
        <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>Created from the import screen — one per software or report layout you use.</div>
        {local.importProfiles.length === 0 && <div style={{ fontSize: 13, color: INK_SOFT }}>None saved yet.</div>}
        {local.importProfiles.map((p) => (
          <div key={p.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: `1px solid ${LINE}` }}>
            <span style={{ fontSize: 14 }}>{p.name}</span>
            <button onClick={() => removeProfile(p.name)} style={{ border: "none", background: "none", color: SIENNA, cursor: "pointer" }}><X size={16} /></button>
          </div>
        ))}
      </div>

      {window.__standaloneApp && (
        <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
          <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>AI scan (Anthropic API key)</div>
          <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>
            The standalone app needs your own key to use "Scan (AI)" — this build isn't running inside Claude, so it can't
            use Claude's built-in access. Get a key at console.anthropic.com, paste it below, and it's stored only in this
            browser on this device. Each scan costs a small amount on your Anthropic account (typically well under a cent).
          </div>
          <Field label="Anthropic API key"><input type="password" style={inputStyle} value={local.apiKey} onChange={(e) => setLocal({ ...local, apiKey: e.target.value })} placeholder="sk-ant-..." /></Field>
        </div>
      )}

      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>Privacy</div>
        <label style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14, marginTop: 8 }}>
          Hide patient initials on screen
          <input type="checkbox" checked={local.hidePatients} onChange={(e) => setLocal({ ...local, hidePatients: e.target.checked })} />
        </label>

        <div style={{ borderTop: `1px solid ${LINE}`, marginTop: 14, paddingTop: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>App lock</div>
          <div style={{ fontSize: 11.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>
            Requires a PIN to open the app on this device. This is a local lock, not encryption — there's no recovery
            besides removing it here, so keep it somewhere you'll remember.
          </div>
          {local.pinHash ? (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 13, color: TEAL, fontWeight: 600 }}>PIN is set</span>
              <Btn kind="danger" onClick={removePin}>Remove PIN</Btn>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}><Field label="New PIN"><input type="password" inputMode="numeric" style={inputStyle} value={pinNew} onChange={(e) => setPinNew(e.target.value)} /></Field></div>
              <div style={{ flex: 1 }}><Field label="Confirm PIN"><input type="password" inputMode="numeric" style={inputStyle} value={pinConfirm} onChange={(e) => setPinConfirm(e.target.value)} /></Field></div>
            </div>
          )}
          {!local.pinHash && <Btn onClick={setPin}>Set PIN</Btn>}
          {pinMsg && <div style={{ fontSize: 12, color: INK_SOFT, marginTop: 8 }}>{pinMsg}</div>}
        </div>
      </div>

      <Btn kind="primary" onClick={save} style={{ width: "100%", marginBottom: 8 }}><Check size={15} />Save settings</Btn>
      {savedMsg && <div style={{ fontSize: 12.5, color: TEAL, marginBottom: SP }}>{savedMsg}</div>}

      <div style={{ ...GLASS, padding: 16, marginBottom: SP }}>
        <div style={{ ...SECTION_TITLE, fontSize: 14.5 }}>Backup & restore</div>
        <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 10, lineHeight: 1.5 }}>A full backup includes visits, settings, and trash — CSV export does not. Photos stay on this device and aren't included.</div>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn onClick={downloadBackup}><Download size={15} />Download backup</Btn>
          <Btn onClick={() => backupInputRef.current?.click()}><Upload size={15} />Restore backup</Btn>
          <input ref={backupInputRef} type="file" accept=".json" style={{ display: "none" }} onChange={restoreBackup} />
        </div>
      </div>

      <div style={{ ...GLASS, padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <div style={{ ...SECTION_TITLE, fontSize: 14.5, marginBottom: 0 }}>Trash · {deleted.length}</div>
          {deleted.length > 0 && <button onClick={emptyTrash} style={{ border: "none", background: "none", color: SIENNA, fontSize: 12.5, cursor: "pointer", fontWeight: 600 }}>Empty trash</button>}
        </div>
        <div style={{ fontSize: 12.5, color: INK_SOFT, marginBottom: 8, marginTop: 8, lineHeight: 1.5 }}>Deleted visits stay here until restored or emptied. They're excluded from every report.</div>
        {deleted.length === 0 && <div style={{ fontSize: 13, color: INK_SOFT }}>Nothing deleted.</div>}
        {deleted.map((v) => (
          <div key={v.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: `1px solid ${LINE}`, padding: "8px 0" }}>
            <span style={{ fontSize: 13 }}>{fmtDate(v.date)} · {fmtMoney(v.charge)}</span>
            <button onClick={() => restoreVisit(v)} style={{ border: "none", background: "none", color: TEAL, fontSize: 12.5, cursor: "pointer", fontWeight: 600, display: "flex", alignItems: "center", gap: 4 }}><RotateCcw size={13} />Restore</button>
          </div>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ChairsideLedger />);

</script>
</body>
</html>
