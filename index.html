// ---------- storage shim: mirrors the Claude-artifact window.storage API, backed by IndexedDB ----------
// (IndexedDB instead of localStorage on purpose — localStorage caps out around 5-10MB total,
// which a photo library blows through fast. IndexedDB's ceiling is tied to free device disk
// space, typically hundreds of MB to a few GB, so photos and years of visits comfortably fit.)
(function () {
  var dbPromise = new Promise(function (resolve, reject) {
    var req = indexedDB.open("chairside_ledger_db", 1);
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", { keyPath: "key" });
    };
    req.onsuccess = function (e) { resolve(e.target.result); };
    req.onerror = function () { reject(req.error); };
  });

  function reqToPromise(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function txDone(tx) {
    return new Promise(function (resolve, reject) {
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.onabort = function () { reject(tx.error); };
    });
  }

  window.storage = {
    get: function (key) {
      return dbPromise.then(function (db) {
        var tx = db.transaction("kv", "readonly");
        return reqToPromise(tx.objectStore("kv").get(key)).then(function (rec) {
          return rec ? { key: rec.key, value: rec.value } : null;
        });
      }).catch(function () { return null; });
    },
    set: function (key, value) {
      return dbPromise.then(function (db) {
        var tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put({ key: key, value: value });
        return txDone(tx).then(function () { return { key: key, value: value }; });
      }).catch(function () { return null; });
    },
    delete: function (key) {
      return dbPromise.then(function (db) {
        var tx = db.transaction("kv", "readwrite");
        return reqToPromise(tx.objectStore("kv").get(key)).then(function (existing) {
          tx.objectStore("kv").delete(key);
          return txDone(tx).then(function () { return { key: key, deleted: !!existing }; });
        });
      }).catch(function () { return null; });
    },
    list: function (prefix) {
      return dbPromise.then(function (db) {
        var tx = db.transaction("kv", "readonly");
        return reqToPromise(tx.objectStore("kv").getAllKeys()).then(function (allKeys) {
          var p = prefix || "";
          var keys = allKeys.filter(function (k) { return k.indexOf(p) === 0; });
          return { keys: keys, prefix: prefix };
        });
      }).catch(function () { return null; });
    },
  };
  window.__standaloneApp = true;

  // ask the browser not to silently evict this data under storage pressure
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
})();

};

const toISODate = (v) => {
  if (!v) return null;
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    let [, mm, dd, yy] = m;
    if (yy.length === 2) yy = (parseInt(yy) > 70 ? "19" : "20") + yy;
    return `${yy}-${mm.padStart(2, "0")}-${dd.padStart(2, "0")}`;
  }
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return null;
};

// period range helper, reused for both the current and the prior period (for trend deltas)
function computeRange(mode, offset, settings) {
  if (mode === "all") return null;
  if (mode === "month") {
    const base = shiftMonth(startOfMonth(todayISO()), offset);
    return { start: base, end: addDays(shiftMonth(base, 1), -1), label: monthLabel(base) };
  }
  const len = Math.max(1, settings.payPeriodLength || 14);
  const start = addDays(settings.payPeriodStart, offset * len);
  return { start, end: addDays(start, len - 1), label: `${fmtDate(start)} – ${fmtDate(addDays(start, len - 1))}` };
}

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

// insurance aging: how long each still-pending claim has been outstanding, bucketed
function computeAging(visits) {
  const today = new Date(todayISO() + "T00:00:00");
  const buckets = { "0–30": 0, "31–60": 0, "61–90": 0, "90+": 0 };
  const claims = [];
  visits.forEach((v) => {
    const pending = (v.insuranceBilled || 0) - (v.insurancePaid || 0);
    if (pending > 0.01) {
      const days = Math.max(0, Math.floor((today - new Date(v.date + "T00:00:00")) / 86400000));
      const bucket = days <= 30 ? "0–30" : days <= 60 ? "31–60" : days <= 90 ? "61–90" : "90+";
      buckets[bucket] += pending;
      claims.push({ ...v, pending, days });
    }
  });
  claims.sort((a, b) => b.days - a.days);
  return { buckets, claims };
}

// resize + compress a photo client-side before it ever touches storage
function compressImage(file, maxW = 1000, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function guessMapping(headers) {
  const map = {};
  const norm = (s) => s.toLowerCase().trim();
  FIELD_DEFS.forEach((f) => {
    const hit = headers.find((h) => f.aliases.includes(norm(h)));
    map[f.key] = hit || (headers.find((h) => f.aliases.some((a) => norm(h).includes(a))) || "");
  });
  return map;
}

function AnimatedNumber({ value, format }) {
  const [display, setDisplay] = useState(value);
  const prevRef = useRef(value);
  useEffect(() => {
    const from = prevRef.current;
    const to = value;
    if (from === to) return;
    const start = performance.now();
    const dur = 500;
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(from + (to - from) * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
      else { prevRef.current = to; setDisplay(to); }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <>{format(display)}</>;
}

          <div style={{ height: 9, borderRadius: 5, background: LINE, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${(d[valueKey] / max) * 100}%`, background: color, borderRadius: 5, transition: "width .5s ease" }} />
          </div>
        </div>
      ))}

  );
}

// trend badge: compares current vs prior-period value. invert=true means "up" is bad (e.g. outstanding).
function Trend({ cur, prev, invert = false, point = false }) {
  if (prev == null) return null;
  if (prev === 0 && cur === 0) return null;
  let dir, mag;
  if (point) {
    const diff = cur - prev;
    dir = diff > 0.05 ? "up" : diff < -0.05 ? "down" : "flat";
    mag = Math.abs(diff);
  } else if (prev === 0) {
    dir = cur > 0 ? "up" : "flat";
    mag = null;
  } else {
    const diff = ((cur - prev) / Math.abs(prev)) * 100;
    dir = diff > 0.5 ? "up" : diff < -0.5 ? "down" : "flat";
    mag = Math.abs(diff);
  }
  if (dir === "flat") return <span style={{ fontSize: 11, color: INK_SOFT, fontWeight: 600 }}>flat</span>;
  const good = invert ? dir === "down" : dir === "up";
  const color = good ? TEAL : SIENNA;
  const label = mag == null ? "new" : point ? `${mag.toFixed(1)}pt` : `${mag.toFixed(1)}%`;
  return (
    <span style={{ fontSize: 11, fontWeight: 700, color, display: "inline-flex", alignItems: "center", gap: 2 }}>
      {dir === "up" ? "▲" : "▼"} {label}
    </span>
  );
}
